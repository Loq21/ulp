<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ulp — Сервис обновляется</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f4f6fa 0%, #e9edf2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-tap-highlight-color: transparent;
        }

        /* Стеклянный стиль ulp — как в оригинале */
        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 42px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.08);
        }

        .container {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            animation: fadeSlideUp 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1) both;
        }

        /* Карточка */
        .placeholder-card {
            text-align: center;
            padding: 2.5rem 2rem;
        }

        /* Логотип ulp — строго как в оригинале, без анимации, нормальная жирность 700 */
        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 605;
            margin-bottom: 1.5rem;
            cursor: pointer;
            background: linear-gradient(135deg, #1a1a1a, #4a4a4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: normal;
            font-family: 'Inter', sans-serif;
        }

        .logo-text {
            display: inline-flex;
            align-items: center;
        }

        /* Все буквы статичны, всегда видны — никакой анимации */
        .logo-u, .logo-l1, .logo-l2, .logo-p {
            display: inline-block;
        }

        .logo-l2 {
            margin-right: 2px;
        }

        /* Заголовок */
        .message-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            background: rgba(255, 255, 255, 0.5);
            display: inline-block;
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            margin-bottom: 1rem;
        }

        /* Описание */
        .description {
            font-size: 0.96rem;
            color: #4a5568;
            max-width: 360px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Разделитель */
        .divider-light {
            width: 48px;
            height: 2px;
            background: rgba(26, 188, 156, 0.3);
            border-radius: 2px;
            margin: 1.4rem auto;
        }

        /* Футер */
        .footer-note {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #8e9aaf;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Анимация появления карточки */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Адаптив */
        @media (max-width: 520px) {
            body {
                padding: 1rem;
            }
            .placeholder-card {
                padding: 1.8rem 1.2rem;
            }
            .logo {
                font-size: 2.3rem;
                margin-bottom: 1rem;
            }
            .message-title {
                font-size: 1.1rem;
                padding: 0.4rem 1.2rem;
            }
            .description {
                font-size: 0.85rem;
            }
        }

        /* Тёмная тема — как в оригинале ulp */
        body.dark-theme {
            background: linear-gradient(135deg, #0f1117 0%, #181c24 100%);
            color: #f0f2f5;
        }
        body.dark-theme .glass {
            background: rgba(30, 33, 40, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
        }
        body.dark-theme .logo {
            background: linear-gradient(135deg, #ffffff, #b0b0b0);
            -webkit-background-clip: text;
            background-clip: text;
        }
        body.dark-theme .message-title {
            background: rgba(40, 44, 54, 0.7);
            color: #cbd5e6;
        }
        body.dark-theme .description {
            color: #b9c3da;
        }
        body.dark-theme .footer-note {
            color: #6c7a8e;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="glass placeholder-card">
        <!-- Логотип ulp: статичный, без анимации, жирность 700 как в оригинале -->
        <div class="logo" id="ulpLogo">
            <span class="logo-text">
                <span class="logo-u">u</span>
                <span class="logo-l1">l</span>
                <span class="logo-p">p</span>
            </span>
        </div>

        <!-- Текстовая информация -->
        <div class="message-title">
            Видутся профилактические работы
        </div>
        
        <div class="description">
            Мы работаем над новыми функциями.<br>
            Скоро всё снова заработает в полную силу.
        </div>

        <div class="divider-light"></div>
        
        <div class="footer-note">
            <span>Техническое обслуживание</span>
            <span>•</span>
            <span id="liveDate"></span>
        </div>
    </div>
</div>

<script>
    // Переключение тёмной/светлой темы по клику на логотип (как в оригинальном ulp)
    const logoEl = document.getElementById('ulpLogo');
    if (logoEl) {
        logoEl.style.cursor = 'pointer';
        logoEl.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('ulp-dark-theme', isDark);
            showGentleToast(isDark ? 'Тёмная тема' : 'Светлая тема');
        });
    }

    // Лёгкое всплывающее уведомление (ненавязчивое)
    let toastTimeout = null;
    function showGentleToast(message) {
        let existing = document.querySelector('.ulp-toast-gentle');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'ulp-toast-gentle';
        toast.textContent = message;
        toast.style.position = 'fixed';
        toast.style.bottom = '28px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = 'rgba(28, 32, 38, 0.92)';
        toast.style.backdropFilter = 'blur(20px)';
        toast.style.color = '#f1f3f7';
        toast.style.padding = '10px 24px';
        toast.style.borderRadius = '48px';
        toast.style.fontSize = '0.8rem';
        toast.style.fontWeight = '500';
        toast.style.zIndex = '9999';
        toast.style.boxShadow = '0 8px 22px rgba(0, 0, 0, 0.2)';
        toast.style.border = '1px solid rgba(255,255,255,0.12)';
        toast.style.fontFamily = 'Inter, sans-serif';
        toast.style.whiteSpace = 'nowrap';
        document.body.appendChild(toast);
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => { if (toast) toast.remove(); }, 400);
        }, 1900);
    }

    // Инициализация темы из localStorage
    function initTheme() {
        const savedTheme = localStorage.getItem('ulp-dark-theme');
        if (savedTheme === 'true') {
            document.body.classList.add('dark-theme');
        }
    }

    // Живая дата в футере
    function updateDateFooter() {
        const dateSpan = document.getElementById('liveDate');
        if (dateSpan) {
            const now = new Date();
            const options = { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' };
            dateSpan.textContent = now.toLocaleDateString('ru-RU', options);
        }
    }

    // Лёгкая анимация тени карточки (визуальный акцент, не мешает)
    const cardDiv = document.querySelector('.glass');
    if (cardDiv) {
        setInterval(() => {
            const glow = Math.sin(Date.now() / 3200) * 0.03 + 0.07;
            cardDiv.style.boxShadow = `0 22px 48px rgba(0, 0, 0, ${glow})`;
        }, 180);
    }

    initTheme();
    updateDateFooter();
    setInterval(updateDateFooter, 60000);
</script>
</body>
</html>
